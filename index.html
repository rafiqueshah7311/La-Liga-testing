<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaLiga Hub – La Liga Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,600;0,700;1,800&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  /* backgrounds: desktop/landscape (16:9) and portrait/phone (9:16) */
  --bg-desktop:url("background.jpg");
  --bg-mobile:url("background-mobile.jpg");
  --bg-image:var(--bg-desktop);
  --blue:#2f95ff; --cyan:#27c4ff; --ice:#cfe6ff; --head:#5db4ff;
  --win:#2fd07a; --draw:#a3b1d9; --loss:#ff3b3b;
  --font:'Exo 2','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);color:#fff;background:#020a1f;min-height:100vh;padding:24px 3% 28px;overflow-x:hidden}

/* ---------- Background: stadium image + dark neon overlay ---------- */
.bg{position:fixed;inset:0;height:100lvh;z-index:-1;
  background:
    radial-gradient(ellipse at 50% 18%,rgba(2,10,36,.55),transparent 60%),
    linear-gradient(rgba(2,8,28,.50),rgba(1,6,24,.58)),
    var(--bg-image) center/cover no-repeat,
    linear-gradient(#030c28,#010512);
}
.bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,3,15,.65) 100%)}

/* ---------- Navbar ---------- */
.nav{display:flex;align-items:center;height:70px;padding:0 26px 0 36px;border-radius:40px;
  border:2px solid var(--blue);
  background:linear-gradient(180deg,rgba(10,30,80,.62),rgba(4,14,46,.78));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 0 0 1px rgba(110,190,255,.25),0 0 16px 1px rgba(47,149,255,.85),0 0 46px rgba(30,100,255,.4),inset 0 0 22px rgba(47,149,255,.3);
  position:relative}
.logo{display:flex;align-items:center;gap:12px;font-style:italic;font-weight:800;font-size:25px;letter-spacing:.01em;text-decoration:none;color:#fff}
.logo svg{width:42px;height:46px;filter:drop-shadow(0 0 8px rgba(47,149,255,.9))}
.logo b{color:var(--blue);font-weight:800;text-shadow:0 0 12px rgba(47,149,255,.7)}
.links{display:flex;margin-left:40px;height:100%}
.links a{position:relative;display:flex;align-items:center;gap:9px;padding:0 22px;color:#e8f2ff;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;transition:color .2s}
.links a svg{width:19px;height:19px;stroke:#bfdcff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.links a:hover{color:#fff}
.links a:hover svg{stroke:#fff;filter:drop-shadow(0 0 6px var(--blue))}
.links a.active svg{stroke:#4aa8ff;filter:drop-shadow(0 0 6px rgba(47,149,255,.9))}
.links a.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px;
  background:var(--cyan);box-shadow:0 0 10px 2px rgba(39,196,255,.9),0 0 22px rgba(39,196,255,.5)}
.search{margin-left:auto;width:320px;height:40px;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:22px;
  background:rgba(35,80,160,.5);border:1px solid rgba(110,170,255,.35);box-shadow:inset 0 0 14px rgba(47,149,255,.25)}
.search svg{width:18px;height:18px;stroke:#8fc3ff;fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#e8f2ff;font:500 15px var(--font)}
.search input::placeholder{color:#9cc3f0}
.search:focus-within{border-color:var(--cyan);box-shadow:0 0 14px rgba(39,196,255,.55),inset 0 0 14px rgba(47,149,255,.3)}
.sep{width:1px;height:34px;margin:0 20px 0 22px;background:linear-gradient(transparent,rgba(110,170,255,.5),transparent)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:2px solid #35b6ff;
  background:radial-gradient(circle,#123a86,#071a47);box-shadow:0 0 14px rgba(53,182,255,.9),inset 0 0 10px rgba(53,182,255,.4)}
.avatar svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}

/* ---------- Title ---------- */
.hero{text-align:center;margin-top:22px}
h1{font-family:'Playfair Display','Times New Roman',serif;font-weight:800;font-size:58px;line-height:1.05;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff 25%,#a9d3ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(60,150,255,.85)) drop-shadow(0 2px 2px rgba(0,0,20,.6))}
.season{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:6px;font-size:21px;font-weight:500;letter-spacing:.3em;color:var(--ice);text-shadow:0 0 10px rgba(80,160,255,.8)}
.season i{width:112px;height:2px;background:linear-gradient(90deg,transparent,var(--cyan));box-shadow:0 0 10px var(--cyan)}
.season i:last-child{background:linear-gradient(90deg,var(--cyan),transparent)}
.badge{display:inline-flex;align-items:center;gap:9px;margin-top:8px;padding:3px 18px 3px 6px;border-radius:20px;
  border:1px solid rgba(110,170,255,.55);background:rgba(6,22,66,.7);font-size:15px;font-weight:500;letter-spacing:.07em;
  box-shadow:0 0 12px rgba(47,149,255,.45),inset 0 0 10px rgba(47,149,255,.2)}
.badge svg{width:25px;height:25px}

/* ---------- Table card ---------- */
.card{width:min(1068px,100%);margin:14px auto 0;padding:8px 11px 0;border-radius:30px;border:2px solid var(--blue);
  background:linear-gradient(180deg,rgba(100,180,255,.16),rgba(100,180,255,0) 14%),linear-gradient(180deg,rgba(18,62,155,.36),rgba(6,26,84,.46) 45%,rgba(5,20,66,.5));
  backdrop-filter:blur(5px) saturate(1.3);-webkit-backdrop-filter:blur(5px) saturate(1.3);
  box-shadow:0 0 0 1px rgba(110,190,255,.3),0 0 18px 2px rgba(47,149,255,.85),0 0 64px rgba(30,100,255,.45),inset 0 0 30px rgba(47,149,255,.35)}
.scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:#2f95ff transparent}
.grid{min-width:780px;display:grid;grid-template-columns:64px minmax(180px,1fr) 71px 71px 71px 71px 72px 72px 74px 78px 146px;align-items:center;text-align:center}
.thead,.row{display:contents}
.thead>div{height:34px;display:flex;align-items:center;justify-content:center;color:var(--head);font-weight:700;font-size:14px;letter-spacing:.06em;
  border-bottom:1px solid rgba(90,170,255,.35);text-shadow:0 0 8px rgba(47,149,255,.7)}
.thead>div:nth-child(2){justify-content:flex-start;padding-left:19px}
.row>div{position:relative;height:27.7px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;
  background:rgba(24,72,165,.27);border-bottom:1px solid rgba(120,180,255,.2);transition:background .2s}
.row:hover>div{background:rgba(52,120,220,.4)}
.row>div:first-child{font-weight:700;font-size:14.5px}
.row>div:first-child::before{content:"";position:absolute;left:2px;top:0;bottom:0;width:6px;background:var(--zone,transparent);box-shadow:0 0 10px var(--zone,transparent)}
.row.cl{--zone:#19c6ff}
.row.cl>div{background:rgba(30,105,225,.3)}
.row.cl:hover>div{background:rgba(52,125,230,.45)}
.row.rel{--zone:#ff2b4d}
.row.rel>div{background:rgba(135,24,68,.42)}
.row.rel:hover>div{background:rgba(190,40,80,.55)}
.row.rel>div:first-child{color:#ff6b7d}
.row>div.club{justify-content:flex-start;padding-left:16px;gap:19px;text-align:left}
.row .pts{font-weight:700;font-size:15px}
.crest{width:24px;height:24px;flex:none;object-fit:contain;display:grid;place-items:center;font-size:8px;font-weight:800;letter-spacing:0;
  border-radius:5px 5px 13px 13px;border:1.5px solid;box-shadow:0 0 6px rgba(0,0,0,.5)}
.form{gap:9px}
.dot{width:14px;height:14px;border-radius:50%}
.dot.W{background:var(--win);box-shadow:0 0 8px rgba(47,208,122,.75)}
.dot.D{background:var(--draw);box-shadow:0 0 6px rgba(163,177,217,.45)}
.dot.L{background:var(--loss);box-shadow:0 0 8px rgba(255,59,59,.8)}
.legend{display:flex;justify-content:center;align-items:center;gap:30px;height:38px;font-size:12.5px;color:#d9e8ff}
.legend span{display:flex;align-items:center;gap:7px}
.legend .dot{width:11px;height:11px}
.empty{padding:30px;text-align:center;color:#9cc3f0;display:none}

@media(orientation:portrait){:root{--bg-image:var(--bg-mobile)}}
@media(max-width:1100px){.search{width:200px}.links a{padding:0 14px}}
@media(max-width:860px){
  .links a span,.search,.sep{display:none}
  .nav{padding:0 14px 0 16px;gap:8px}
  .links{flex:1;min-width:0;margin-left:6px;justify-content:space-around}
  .links a{padding:0 6px}
  .avatar{flex:none}
}
@media(max-width:600px){
  body{padding:14px 12px calc(80px + env(safe-area-inset-bottom))}
  .nav{height:60px}
  .logo{font-size:16px;gap:8px}.logo svg{width:32px;height:36px}
  .links a svg{width:18px;height:18px}
  .avatar{width:38px;height:38px}.avatar svg{width:20px;height:20px}
  h1{font-size:36px}
  .season{font-size:14px;gap:10px;letter-spacing:.22em}.season i{width:30px}
  .badge{font-size:12.5px}
  .card{border-radius:24px;padding:6px 8px 0;
    background:linear-gradient(180deg,rgba(100,180,255,.14),rgba(100,180,255,0) 12%),linear-gradient(180deg,rgba(16,52,132,.52),rgba(6,24,78,.62));
    backdrop-filter:blur(8px) saturate(1.2);-webkit-backdrop-filter:blur(8px) saturate(1.2)}
  /* phone: show POS, CLUB, MP, GD, PTS, LAST 5 (hide W, D, L, GF, GA) */
  .grid{min-width:0;grid-template-columns:30px minmax(0,1fr) 32px 38px 36px 72px}
  .thead>div:nth-child(n+4):nth-child(-n+8),.row>div:nth-child(n+4):nth-child(-n+8){display:none}
  .thead>div{font-size:12px;letter-spacing:.03em}
  .thead>div:nth-child(2){padding-left:10px}
  .row>div{height:33px;font-size:13px}
  .row>div:first-child{font-size:13px}
  .row>div.club{padding-left:8px;gap:8px;min-width:0}
  .crest{width:22px;height:22px;font-size:7px}
  .row .pts{font-size:14px}
  .form{gap:5px}.dot{width:9px;height:9px}
  .legend{font-size:11.5px;gap:16px}.legend .dot{width:9px;height:9px}
}
@media(max-width:380px){
  .logo{font-size:14px}.logo svg{width:28px;height:32px}
  .grid{grid-template-columns:26px minmax(0,1fr) 28px 34px 32px 60px}
  .form{gap:4px}.dot{width:8px;height:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>

<nav class="nav">
  <a class="logo" href="#">
    <svg viewBox="0 0 42 46"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#0b3cb0"/></linearGradient></defs>
      <path d="M21 2 4 8v14c0 11 7 19 17 22 10-3 17-11 17-22V8z" fill="url(#sg)" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="21" cy="23" r="9.5" fill="#fff"/><path d="m21 17.5 4.6 3.3-1.8 5.3h-5.6l-1.8-5.3z" fill="#0b2a73"/>
      <path d="M21 17.5V13.5M25.6 20.8l4-1.3M23.8 26.1l2.6 3.2M18.2 26.1l-2.6 3.2M16.4 20.8l-4-1.3" stroke="#0b2a73" stroke-width="1.3"/></svg>
    LALIGA <b>HUB</b>
  </a>
  <div class="links" id="links">
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg><span>Home</span></a>
    <a href="#" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg><span>Table</span></a>
    <a href="#"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 18h2"/></svg><span>Fixtures</span></a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span>Scheduled / Delayed</span></a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M4 21V11M10 21V4M16 21v-8M21 21H3M22 21V8"/></svg><span>League Tables</span></a>
  </div>
  <label class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Search teams, players..." autocomplete="off">
  </label>
  <div class="sep"></div>
  <div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>
</nav>

<header class="hero">
  <h1>My Ligue Table</h1>
  <div class="season"><i></i>2026 / 27 SEASON<i></i></div>
  <div class="badge">
    <svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#0b2a73" stroke="#fff" stroke-width="1.4"/><path d="M13 1a12 12 0 0 1 10.4 6L13 13z" fill="#ff4d4d"/><path d="M13 1A12 12 0 0 0 2.6 7L13 13z" fill="#ffc933"/><path d="M13 13 2.6 19A12 12 0 0 0 13 25z" fill="#3aa0ff"/><circle cx="13" cy="13" r="5" fill="#fff"/><circle cx="13" cy="13" r="2" fill="#0b2a73"/></svg>
    SPANISH TOP DIVISION
  </div>
</header>

<main class="card">
  <div class="scroll">
    <div class="grid" id="grid">
      <div class="thead"><div>POS</div><div>CLUB</div><div>MP</div><div>W</div><div>D</div><div>L</div><div>GF</div><div>GA</div><div>GD</div><div>PTS</div><div>LAST 5</div></div>
    </div>
  </div>
  <p class="empty" id="empty">No team matches your search.</p>
  <div class="legend"><span><i class="dot W"></i>= WIN</span><span><i class="dot D"></i>= DRAW</span><span><i class="dot L"></i>= LOSS</span></div>
</main>

<script>
/* name, short, crest colour, crest text colour, MP, W, D, L, GF, GA, last 5
   GD and PTS are calculated automatically.
   Later: replace this array with football-data.org data and set `crest` to team.crest */
const TEAMS=[
["Real Madrid","RMA","#f4f4f4","#c9a227",14,11,2,1,32,12,"WWWDW"],
["FC Barcelona","FCB","#1b3f9c","#d6213f",14,10,3,1,31,11,"WWWDW"],
["Atletico Madrid","ATM","#d3202f","#fff",14,9,3,2,24,11,"WWDWW"],
["Athletic Club","ATH","#d3202f","#fff",14,8,4,2,22,11,"WDWWW"],
["Villarreal","VIL","#f5d000","#0b3a8c",14,7,4,3,20,14,"WWDDL"],
["Real Betis","BET","#0a8f3c","#fff",14,7,3,4,19,16,"WDWDL"],
["Real Sociedad","RSO","#1f56b5","#fff",14,6,5,3,18,14,"WDWDW"],
["Valencia","VAL","#f4f4f4","#f08a1c",14,6,4,4,20,18,"WDDDL"],
["Sevilla","SEV","#f4f4f4","#d3202f",14,6,3,5,17,16,"DWDLW"],
["Girona","GIR","#d3202f","#fff",14,5,5,4,18,17,"WDWDD"],
["Celta Vigo","CEL","#7bc4ee","#fff",14,5,4,5,16,15,"DWLDD"],
["Osasuna","OSA","#c4162a","#0b2a5a",14,5,4,5,14,17,"DDLDL"],
["Getafe","GET","#1f56b5","#fff",14,4,5,5,13,16,"DDWLW"],
["Rayo Vallecano","RAY","#f4f4f4","#d3202f",14,4,4,6,14,18,"LDWDL"],
["Mallorca","MLL","#c4162a","#111",14,4,3,7,13,20,"DLLDW"],
["Espanyol","ESP","#1f56b5","#fff",14,3,5,6,12,17,"DWDWL"],
["Alaves","ALA","#1f56b5","#fff",14,3,4,7,11,18,"LDDWL"],
["Elche","ELC","#f4f4f4","#0a8f3c",14,2,5,7,10,20,"DDLWD"],
["Levante","LEV","#c4162a","#1f4aa8",14,2,4,8,9,22,"LDLLW"],
["Real Oviedo","OVI","#1f56b5","#fff",14,1,3,10,8,24,"LLDLD"]
];
const grid=document.getElementById('grid'),empty=document.getElementById('empty');

function render(list){
  grid.querySelectorAll('.row').forEach(r=>r.remove());
  list.forEach((t,i)=>{
    const [name,ab,c1,c2,mp,w,d,l,gf,ga,form]=t, pos=i+1, gd=gf-ga, pts=w*3+d;
    const row=document.createElement('div');
    row.className='row'+(pos<=4?' cl':'')+(pos>=17?' rel':'');
    row.dataset.name=name.toLowerCase();
    const crest=t.crest?`<img class="crest" src="${t.crest}" alt="">`
      :`<span class="crest" style="background:${c1};color:${c2};border-color:${c2}">${ab}</span>`;
    row.innerHTML=`<div>${pos}</div><div class="club">${crest}${name}</div><div>${mp}</div><div>${w}</div><div>${d}</div><div>${l}</div><div>${gf}</div><div>${ga}</div><div>${gd>0?'+':''}${gd}</div><div class="pts">${pts}</div><div class="form">${[...form].map(f=>`<i class="dot ${f}"></i>`).join('')}</div>`;
    grid.appendChild(row);
  });
}
render(TEAMS);

/* live search by club name */
document.getElementById('q').addEventListener('input',e=>{
  const v=e.target.value.trim().toLowerCase();let shown=0;
  grid.querySelectorAll('.row').forEach(r=>{
    const hit=!v||r.dataset.name.includes(v);
    r.style.display=hit?'contents':'none';if(hit)shown++;
  });
  empty.style.display=shown?'none':'block';
});

/* nav tab highlight */
document.querySelectorAll('#links a').forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault();
  document.querySelectorAll('#links a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
}));
</script>
</body>
</html>
